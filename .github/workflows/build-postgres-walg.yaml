name: build-postgres-walg

# Publica a imagem postgres-walg no GHCR quando o Dockerfile muda.
# A tag fica pinada por digest em k8s/base/postgres.yaml (bump manual apos o build).
on:
  push:
    branches: [main]
    paths:
      - images/postgres-walg/**
      - .github/workflows/build-postgres-walg.yaml
  pull_request:
    paths:
      - images/postgres-walg/**
      - .github/workflows/build-postgres-walg.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: images/postgres-walg
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/postgres-walg:16-3.0.7
            ghcr.io/${{ github.repository_owner }}/postgres-walg:sha-${{ github.sha }}

      - name: Digest publicado
        run: |
          echo "### Imagem postgres-walg publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
