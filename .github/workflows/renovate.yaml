name: renovate

# Renovate self-hosted, alternativa ao app do Mend. Precisa do secret
# RENOVATE_TOKEN (PAT com escopo repo) configurado no repo. Sem o secret, a
# execucao falha de proposito, para nao passar em branco. O comportamento (o
# que atualiza, o que automergeia) vive em renovate.json.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info
