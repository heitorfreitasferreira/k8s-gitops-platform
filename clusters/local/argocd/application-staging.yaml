apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todolist-staging
  namespace: argocd
spec:
  project: todolist
  source:
    repoURL: https://github.com/heitorfreitasferreira/k8s-gitops-platform.git
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: todolist-staging
  syncPolicy:
    # Staging sincroniza sozinho: push em staging -> CI bump -> Argo aplica.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # O Secret gerado pelo controller nao esta no Git: sem isso o Argo
    # entraria em OutOfSync eterno brigando com o controller.
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
      managedFieldsManagers:
        - sealed-secrets-controller
