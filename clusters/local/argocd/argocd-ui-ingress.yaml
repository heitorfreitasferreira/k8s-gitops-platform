# Bonus: ArgoCD UI acessivel pelo mesmo LB (Traefik), sem port-forward.
# O argocd-server roda com --insecure (TLS terminado no proprio cluster,
# aceitavel para ambiente local); assim o Traefik fala HTTP simples com ele.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd.localhost
  rules:
    - host: argocd.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
