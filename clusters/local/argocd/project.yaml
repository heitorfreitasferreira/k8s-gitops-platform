apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: todolist
  namespace: argocd
spec:
  description: GitOps platform: todolist (staging + production)
  sourceRepos:
    - https://github.com/heitorfreitasferreira/k8s-gitops-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: todolist-staging
    - server: https://kubernetes.default.svc
      namespace: todolist-production
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  # RBAC e Secret ficam no GitOps de proposito (allowlist explicita).
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: batch
      kind: CronJob
    # Pod/ReplicaSet/Job NAO sao gerenciados (nao existem no Git), mas precisam
    # estar na allowlist: o Argo esconde da arvore recursos fora dela, e como
    # Pods herdam visibilidade do ReplicaSet (e Jobs do CronJob), sem essas
    # 3 linhas a UI mostra so os pais (sem aba LOGS por pod).
    - group: ""
      kind: Pod
    - group: apps
      kind: ReplicaSet
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: Ingress
    - group: policy
      kind: PodDisruptionBudget
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
