# Regras proprias do projeto. O Prometheus do kube-prometheus-stack seleciona
# todos os PrometheusRules do cluster (ruleSelectorNilUsesHelmValues: false).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todolist-alertas
  labels:
    app.kubernetes.io/part-of: todolist
spec:
  groups:
    - name: todolist.disponibilidade
      rules:
        # Disponibilidade: nenhum target da app responde ao scrape.
        - alert: TodoListAppDown
          expr: up{namespace=~"todolist-.*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "App fora do ar em {{ $labels.namespace }}"
            description: "O Prometheus nao consegue raspar o /metrics (target down)."
    - name: todolist.pipeline
      rules:
        # Alerta de teste sempre ativo. Prova que o caminho
        # Prometheus -> Alertmanager -> ntfy esta ligado ponta a ponta.
        # (Nao se chama Watchdog de proposito: o chart do kube-prometheus-stack
        # roteia esse nome para o receiver "null".)
        - alert: TodoListPipelineTest
          expr: vector(1)
          for: 0m
          labels:
            severity: none
          annotations:
            summary: "Alerta de teste do caminho de alertas"
            description: "Sempre ativo de proposito. Usado para validar a entrega no ntfy."
    - name: nodes
      rules:
        # NodeDown: o node-exporter de uma VM parou de responder.
        - alert: NodeDown
          expr: up{job=~"node-exporter|minio-node"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "VM fora do ar: {{ $labels.instance }}"
            description: "O node-exporter desta VM nao responde ao scrape ha mais de 2 minutos."
        # Disco acima de 80% em um filesystem real.
        - alert: NodeDiskPressure
          expr: >-
            (1 - node_filesystem_avail_bytes{job=~"node-exporter|minio-node",device!="none",fstype!~"tmpfs|overlay|squashfs|ramfs"}
                 / node_filesystem_size_bytes{job=~"node-exporter|minio-node",device!="none",fstype!~"tmpfs|overlay|squashfs|ramfs"}) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Disco acima de 80% em {{ $labels.instance }} ({{ $labels.mountpoint }})"
            description: "O filesystem {{ $labels.mountpoint }} passou de 80% de uso."
        # Memoria acima de 85%.
        - alert: NodeMemoryHigh
          expr: >-
            (1 - node_memory_MemAvailable_bytes{job=~"node-exporter|minio-node"}
                 / node_memory_MemTotal_bytes{job=~"node-exporter|minio-node"}) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Memoria acima de 85% em {{ $labels.instance }}"
            description: "Uso de memoria sustentado acima de 85% por 10 minutos."
        # CPU sustentada alta.
        - alert: NodeCpuHigh
          expr: >-
            avg by (instance) (rate(node_cpu_seconds_total{job=~"node-exporter|minio-node",mode!="idle"}[5m])) > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CPU sustentada alta em {{ $labels.instance }}"
            description: "Uso de CPU acima de 85% por 15 minutos."
    - name: cilium
      rules:
        # Drops de rede (metricas do Hubble). Limiar baixo o bastante para
        # pegar problema, alto o bastante para nao disparar com ruido normal.
        - alert: CiliumDrops
          expr: sum(rate(hubble_drop_total[5m])) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Drops de rede no Cilium acima do limiar"
            description: "Mais de 1 drop por segundo (media de 5m) por 10 minutos."
    - name: traefik
      rules:
        - alert: Traefik5xx
          expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Traefik respondendo 5xx"
            description: "Requisicoes com status 5xx no Traefik por 5 minutos."
    - name: argocd
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Application fora de sync: {{ $labels.name }}"
            description: "A Application {{ $labels.name }} esta OutOfSync ha 15 minutos."
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Application degradada: {{ $labels.name }}"
            description: "A Application {{ $labels.name }} esta Degraded."
    - name: metallb
      rules:
        # Alerta se houver mais IPs alocados do que IPs efetivamente anunciados.
        - alert: MetalLBAddressNotAnnounced
          expr: count(count by (ip) (metallb_speaker_announced)) < sum(metallb_allocator_addresses_in_use_total)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "IP do MetalLB nao anunciado"
            description: "Ha mais IPs alocados no pool do que IPs anunciados pelo speaker."
    - name: minio
      rules:
        # MinIO/S3: disponibilidade do servico e do host, espaco e erros.
        - alert: MinIODown
          expr: up{job=~"minio-.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "MinIO fora do ar ({{ $labels.job }})"
            description: "Um dos endpoints do MinIO ({{ $labels.job }}) parou de responder ao scrape."
        - alert: MinIOStorageHigh
          expr: (minio_cluster_capacity_usable_free_bytes / minio_cluster_capacity_usable_total_bytes) < 0.2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Espaco do MinIO abaixo de 20%"
            description: "O espaco utilizavel livre do MinIO caiu abaixo de 20%."
        - alert: MinIOErrors
          expr: sum(rate(minio_s3_requests_errors_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Erros nas requisicoes S3 do MinIO"
            description: "Requisicoes S3 com erro nos ultimos 5 minutos."
    - name: slo.todolist
      rules:
        # SLI de disponibilidade: fracao das requisicoes que nao sao 5xx.
        # SLO: 99% (error budget de 1%).
        - record: slo:todolist:error_ratio5m
          expr: >-
            1 - (sum(rate(flask_http_request_total{namespace=~"todolist-.*",status!~"5.."}[5m]))
                 / sum(rate(flask_http_request_total{namespace=~"todolist-.*"}[5m])))
        - record: slo:todolist:error_ratio30m
          expr: >-
            1 - (sum(rate(flask_http_request_total{namespace=~"todolist-.*",status!~"5.."}[30m]))
                 / sum(rate(flask_http_request_total{namespace=~"todolist-.*"}[30m])))
        - record: slo:todolist:error_ratio1h
          expr: >-
            1 - (sum(rate(flask_http_request_total{namespace=~"todolist-.*",status!~"5.."}[1h]))
                 / sum(rate(flask_http_request_total{namespace=~"todolist-.*"}[1h])))
        - record: slo:todolist:error_ratio6h
          expr: >-
            1 - (sum(rate(flask_http_request_total{namespace=~"todolist-.*",status!~"5.."}[6h]))
                 / sum(rate(flask_http_request_total{namespace=~"todolist-.*"}[6h])))
        # Burn-rate multi-janela (Google SRE). O error budget e 1%.
        # 14.4x em 1h queima 2% do budget. 6x em 6h queima 5%.
        - alert: TodoListSLOBurnRateFast
          expr: >-
            slo:todolist:error_ratio1h > (14.4 * 0.01)
            and slo:todolist:error_ratio5m > (14.4 * 0.01)
          for: 2m
          labels:
            severity: critical
            slo: todolist-availability
          annotations:
            summary: "Queima rapida do error budget de disponibilidade"
            description: "Burn-rate acima de 14.4x nas janelas de 1h e 5m. O budget de 1% queima em poucas horas."
        - alert: TodoListSLOBurnRateMedium
          expr: >-
            slo:todolist:error_ratio6h > (6 * 0.01)
            and slo:todolist:error_ratio30m > (6 * 0.01)
          for: 5m
          labels:
            severity: warning
            slo: todolist-availability
          annotations:
            summary: "Queima media do error budget de disponibilidade"
            description: "Burn-rate acima de 6x nas janelas de 6h e 30m."
