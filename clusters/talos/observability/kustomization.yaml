apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Extras da observabilidade: ServiceMonitors da app/banco, dashboards
# (sidecar do Grafana).
resources:
  - servicemonitors.yaml
  - prometheusrules.yaml
generatorOptions:
  labels:
    grafana_dashboard: "1" # sidecar do Grafana auto-carrega este label
  disableNameSuffixHash: true
configMapGenerator:
  - name: dashboard-todolist
    files:
      - dashboards/todolist-app.json
  - name: dashboard-postgres
    files:
      - dashboards/postgres.json
  - name: dashboard-logs
    files:
      - dashboards/logs-staging.json
      - dashboards/logs-production.json
  - name: dashboard-vms-hosts
    files:
      - dashboards/vms-hosts.json
  - name: dashboard-cilium-hubble
    files:
      - dashboards/cilium-hubble.json
  - name: dashboard-traefik
    files:
      - dashboards/traefik.json
  - name: dashboard-argocd
    files:
      - dashboards/argocd.json
  - name: dashboard-metallb
    files:
      - dashboards/metallb.json
  - name: dashboard-slo-todolist
    files:
      - dashboards/slo-todolist.json
