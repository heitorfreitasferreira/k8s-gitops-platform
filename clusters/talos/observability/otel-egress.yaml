# Egress da app para o OTel Collector (tracing). As NetworkPolicies sao
# aditivas: esta libera o que a `todolist-traffic` (base) nao libera, sem
# afrouxar o resto. A policy e namespace-scoped, entao precisa de uma copia
# por ambiente da app. Fica no kustomization da observabilidade porque e a
# contrapartida de rede do collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todolist-otel-egress
  namespace: todolist-staging
spec:
  podSelector:
    matchLabels:
      app: todolist
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4317
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todolist-otel-egress
  namespace: todolist-production
spec:
  podSelector:
    matchLabels:
      app: todolist
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4317
