apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    # Loki precisa existir antes (gateway). Retry cobre a corrida.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.1
    helm:
      releaseName: alloy
      values: |
        # DaemonSet coletando os logs de TODOS os pods do cluster.
        alloy:
          mounts:
            varlog: true
          # Uso real ~310Mi (processa logs de todos os pods); limite 512Mi.
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          configMap:
            create: true
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                // Nao coletar namespaces de infraestrutura (volume/ruido).
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  regex  = "(kube-system|kube-public|kube-node-lease|argocd)"
                  action = "drop"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.process.pods.receiver]
              }

              loki.process "pods" {
                forward_to = [loki.write.default.receiver]

                // Logs da app sao JSON (logging_json.py no repo dela).
                // drop_malformed=false: linhas de texto (postgres/lib) passam.
                stage.json {
                  expressions = {
                    level  = "level",
                    logger = "logger",
                  }
                }

                // level/logger viram LABELS (cardinalidade baixa) p/ filtro e
                // agregacao. Campos de request ficam em structured metadata.
                stage.labels {
                  values = {
                    level  = "",
                    logger = "",
                  }
                }
                stage.structured_metadata {
                  values = {
                    status      = "",
                    method      = "",
                    path        = "",
                    duration_us = "",
                  }
                }

                // Ruido do reader de logs (pod recriado/rotacionado).
                stage.drop {
                  expression          = "failed to try resolving symlinks"
                  drop_counter_reason = "log_reader_warning"
                }
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
