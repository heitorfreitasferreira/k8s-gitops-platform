apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.13.1
    helm:
      releaseName: kube-prometheus-stack
      values: |
        alertmanager:
          enabled: true
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: ntfy
              group_by: ["alertname", "namespace"]
              group_wait: 10s
              group_interval: 1m
              repeat_interval: 1h
              routes:
                # O alerta de teste e sempre ativo. Repete so 1x por dia para
                # nao virar spam no celular.
                - matchers: ['alertname = "TodoListPipelineTest"']
                  receiver: ntfy
                  repeat_interval: 24h
            receivers:
              - name: ntfy
                webhook_configs:
                  - url: http://ntfy-ntfy.observability.svc.cluster.local/todolist-alerts
                    send_resolved: true
                    http_config:
                      authorization:
                        type: Bearer
                        # Token do Secret ntfy-alertmanager, montado pelo
                        # alertmanagerSpec.secrets. Nao fica no config versionado.
                        credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager/token
              # O chart deixa uma rota `Watchdog` apontando para este receiver
              # (no-op). Precisa existir porque a lista de receivers substitui
              # a default inteira.
              - name: "null"
          alertmanagerSpec:
            secrets:
              - ntfy-alertmanager
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { cpu: 100m, memory: 128Mi }
        defaultRules:
          create: false # as regras proprias vivem em clusters/talos/observability
        prometheus:
          prometheusSpec:
            retention: 6h
            # Selecionar TODOS os ServiceMonitors/PrometheusRules do cluster
            # (nao so os do release).
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorNamespaceSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            ruleNamespaceSelector: {}
            # Config de scrape extra (node_exporter e metricas da VM do MinIO),
            # lida de um Secret gerado no Terraform porque o IP nao fica no Git.
            additionalScrapeConfigsSecret:
              enabled: true
              name: prometheus-extra-scrape
              key: scrape-configs.yaml
            resources:
              # Limits dimensionados por uso real medido (kubectl top):
              # Prometheus ~850Mi, Grafana ~750Mi em regime. ~1.8x de folga.
              requests: { cpu: 100m, memory: 512Mi }
              limits: { cpu: "1", memory: 1536Mi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
        grafana:
          # Pin 12.4.9: o chart 90.0.0 traz Grafana 13.2 por padrao, onde
          # prometheus/loki viraram plugins externos (preinstall via
          # grafana.com). Sem o download, o Grafana sobe sem esses
          # datasources ("plugin not registered") e TODOS os dashboards ficam
          # vazios mesmo com o Prometheus coletando. 12.x tem ambos embutidos.
          image:
            tag: "12.4.9"
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.local
            tls:
              - hosts:
                  - grafana.local
          additionalDataSources:
            - name: Loki
              # uid fixo: as regras de alerta referenciam "loki".
              uid: loki
              type: loki
              url: http://loki-gateway.observability.svc.cluster.local
              access: proxy
              jsonData:
                # Log -> trace: o log JSON da app carrega trace_id
                # (logging_json.py). O campo vira link para o trace no Tempo.
                derivedFields:
                  - name: trace_id
                    matcherRegex: '"trace_id":"(\w+)"'
                    url: "$${__value.raw}"
                    datasourceUid: tempo
                    urlDisplayLabel: Ver trace no Tempo
            - name: Tempo
              # uid fixo: o derivedField do Loki e o datasourceUid apontam aqui.
              uid: tempo
              type: tempo
              url: http://tempo.observability.svc.cluster.local:3200
              access: proxy
              jsonData:
                # Trace -> log: filtra o Loki pelo servico e pelo trace_id.
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: "-5m"
                  spanEndTimeShift: "5m"
                  filterByTraceID: true
                  filterBySpanID: false
                  tags:
                    - key: service.name
                      value: app
                # Trace -> metrica: salta para o Prometheus a partir do span.
                tracesToMetrics:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
          # Alerta simples (Grafana-managed) sobre logs de erro. Sem contato de
          # notificacao: o ambiente e local e descartavel (ver DECISIONS).
          alerting:
            rules.yaml:
              apiVersion: 1
              groups:
                - orgId: 1
                  name: todolist-logs
                  folder: TodoList
                  interval: 1m
                  rules:
                    - uid: todolist-erros-logs
                      title: TodoList - logs de erro em staging/production
                      condition: B
                      for: 5m
                      noDataState: OK
                      execErrState: OK
                      labels:
                        severity: warning
                      annotations:
                        summary: Logs de nivel error/critical acima do limiar em 5 minutos
                      data:
                        - refId: A
                          datasourceUid: loki
                          relativeTimeRange: { from: 300, to: 0 }
                          model:
                            editorMode: code
                            queryType: range
                            refId: A
                            expr: 'sum(count_over_time({namespace=~"todolist-.*"} | level=~"(?i)(error|critical)" [5m]))'
                        - refId: B
                          datasourceUid: __expr__
                          relativeTimeRange: { from: 300, to: 0 }
                          model:
                            refId: B
                            type: reduce
                            expression: A
                            reducer: last
                            settings: { mode: "" }
                        - refId: C
                          datasourceUid: __expr__
                          relativeTimeRange: { from: 300, to: 0 }
                          model:
                            refId: C
                            type: math
                            expression: "$B > 0"
                            settings: {}
          resources:
            # Uso real ~750Mi; limite 1Gi (ver DECISIONS).
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
        prometheusOperator:
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
        kube-state-metrics:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
        prometheus-node-exporter:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
