apiVersion: v1
kind: ServiceAccount
metadata:
  name: todolist-cleanup
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: todolist-cleanup
spec:
  # A app nao se limpa sozinha: o CronJob chama POST /cleanup com o token
  # lido do Secret (mesmo SealedSecret da app). Exatamente 1 CronJob por
  # namespace: a pagina /cleanup/status assume isso para achar o historico.
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: todolist-cleanup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: todolist-cleanup
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              env:
                - name: CLEANUP_TOKEN
                  valueFrom: { secretKeyRef: { name: todolist-auth, key: CLEANUP_TOKEN } }
              command: ["sh", "-c", "curl -s -X POST -H \"X-Cleanup-Token: $CLEANUP_TOKEN\" http://todolist/cleanup"]
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 50m, memory: 64Mi }
