apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todolist
spec:
  ingressClassName: traefik
  # Host definido por overlay (staging/production). Sem host, dois
  # Ingresses /* no mesmo LB disputariam o mesmo trafego.
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist
                port:
                  number: 80
