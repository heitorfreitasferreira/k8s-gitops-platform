apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # sempre 2 pods servindo durante rollout
      maxSurge: 1
  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
        app: todolist
    spec:
      serviceAccountName: todolist
      # O gunicorn sobe o app e roda create_all() no import: sem o Postgres de
      # pe, os workers falham e o master sai (CrashLoop no primeiro deploy).
      # O initContainer espera o banco aceitar conexoes antes de iniciar a app.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U todolist; do echo "aguardando postgres..."; sleep 2; done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: todolist
          # Imagem fixada por digest imutavel no overlay (nunca :latest).
          image: ghcr.io/heitorfreitasferreira/todolist-app:PLACEHOLDER-DIGEST
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: postgres # DNS do Service no proprio namespace
            - name: DB_PORT
              value: "5432"
            # DB_NAME nao aceita arquivo (app.py le de env): vem do Secret via env.
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
            # Coletor multiprocess do prometheus-client (gunicorn multi-worker).
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
          # APP_COLOR/APP_NAME (nao segredos) via ConfigMap do overlay.
          envFrom:
            - configMapRef:
                name: todolist-config
          # Credenciais via arquivos (app.py:_config prefere arquivo a env).
          # Volume projected: 2 Secrets no MESMO diretorio (2 volumeMounts no
          # mesmo path esconderiam um ao outro). items: renomeia
          # POSTGRES_* -> DB_* porque o arquivo precisa ter o nome da var.
          volumeMounts:
            - name: creds
              mountPath: /var/run/secrets/todolist
              readOnly: true
            # prometheus-client multiprocess escreve arquivos aqui.
            - name: metrics
              mountPath: /tmp/prometheus-multiproc
          # startupProbe generosa: o gunicorn so escuta depois do create_all()
          # (que depende do Postgres). Sem ela, a liveness matava o pod durante
          # a subida fria do banco (restart-loop no primeiro deploy do cluster).
          startupProbe:
            httpGet: { path: /livez, port: 5000 }
            periodSeconds: 5
            failureThreshold: 24 # ate ~2 min
          livenessProbe:
            # Liveness x Readiness: /livez so diz que o processo vive; se o
            # banco cair o pod NAO reinicia (evita restart-loop), apenas sai
            # do balanceamento ate /healthz voltar.
            httpGet: { path: /livez, port: 5000 }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: creds
          projected:
            sources:
              - secret:
                  name: postgres-credentials
                  items:
                    - key: POSTGRES_USER
                      path: DB_USER
                    - key: POSTGRES_PASSWORD
                      path: DB_PASSWORD
              - secret:
                  name: todolist-auth
                  items:
                    - key: ADMIN_USER
                      path: ADMIN_USER
                    - key: ADMIN_PASSWORD
                      path: ADMIN_PASSWORD
                    - key: SESSION_KEY
                      path: SESSION_KEY
                    - key: CLEANUP_TOKEN
                      path: CLEANUP_TOKEN
        - name: metrics
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: todolist
  labels:
    app.kubernetes.io/name: todolist
spec:
  selector:
    app: todolist
  ports:
    - name: http # ServiceMonitor do Prometheus usa este nome
      port: 80
      targetPort: 5000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: todolist
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: todolist
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todolist
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todolist
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
