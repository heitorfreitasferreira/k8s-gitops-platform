apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# O Secret postgres-credentials e provisionado pelo modulo Terraform platform.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate # 1 replica + 1 PVC: RollingUpdate travaria no volume
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # Best-effort: hostPath (local-path) NAO aplica fsGroup. O dono real do
        # volume e 70:0, dai o runAsUser 70 no container.
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          # Imagem com o WAL-G instalado (upstream alpine + binario pinado).
          # Arquivamento continuo de WAL para o MinIO: habilita PITR.
          image: ghcr.io/heitorfreitasferreira/postgres-walg@sha256:ae308000b31fbcfecf12d656494c9f8ae7b5775a6f6e88d1a983314a450c6fe3
          # O entrypoint do postgres transforma args que comecam com '-' em
          # `postgres -c ...`. archive_command roda o wal-g dentro do container.
          args:
            - -c
            - archive_mode=on
            - -c
            - archive_command=wal-g wal-push %p
            - -c
            - archive_timeout=60
          securityContext:
            runAsNonRoot: true
            # A variante alpine do postgres usa uid 70 (o Debian usa 999).
            # O volume local-path nao recebe fsGroup (hostPath), entao o uid
            # precisa bater com o dono de PGDATA (70:0) para o initdb escrever.
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Credenciais do MinIO para o arquivamento de WAL (wal-push).
          envFrom:
            - secretRef:
                name: minio-backup
          # writeTimeout/readTimeout nao sao aceitos aqui; o wal-g usa o WALG_*
          # do ambiente (envFrom acima) e o PATH ja tem /usr/local/bin.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "todolist"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-tmp
              mountPath: /tmp
            - name: postgres-run
              mountPath: /var/run/postgresql
        # Metricas do banco para o Prometheus (observabilidade).
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
            # $(VAR) expande a partir dos envs acima (mesmo container).
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@localhost:5432/$(POSTGRES_DB)?sslmode=disable"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - name: postgres-tmp
              mountPath: /tmp
        # Base backup diario do WAL-G (backup-push) no mesmo pod: le PGDATA
        # direto do volume, sem copiar o banco pela rede. A retencao apaga os
        # base backups alem dos ultimos 7 (os WAL correspondentes vao junto).
        - name: wal-g-backup
          image: ghcr.io/heitorfreitasferreira/postgres-walg@sha256:ae308000b31fbcfecf12d656494c9f8ae7b5775a6f6e88d1a983314a450c6fe3
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PGHOST
              value: 127.0.0.1
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
          envFrom:
            - secretRef:
                name: minio-backup
          command:
            - sh
            - -c
            - |
              set -eu
              until pg_isready -h 127.0.0.1 -q; do sleep 2; done
              while true; do
                if wal-g backup-push "$PGDATA"; then
                  # Retencao: mantem os ultimos 7 base backups FULL.
                  wal-g delete retain FULL 7 --confirm || true
                else
                  # Sai com erro: o pod reinicia o container e o alerta
                  # PostgresBackupFalhando captura os restarts.
                  echo "wal-g backup-push falhou" >&2
                  exit 1
                fi
                sleep 86400
              done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-tmp
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
    - name: metrics # ServiceMonitor do Prometheus usa este nome
      port: 9187
      targetPort: metrics
