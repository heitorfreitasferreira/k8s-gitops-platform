apiVersion: v1
kind: ServiceAccount
metadata:
  name: todolist
automountServiceAccountToken: false
---
# /pods e o status de cleanup leem a API do Kubernetes via ServiceAccount.
# Leitura minima no proprio namespace. O RoleBinding e completado pelo
# kustomize (namespace do overlay); nao fixar namespace aqui.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: todolist-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # /cleanup/status le os logs dos pods do Job de limpeza.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # /cleanup/status suspende/retoma o CronJob (patch de spec.suspend).
  # RBAC: resourceNames NAO vale para `list` (so get/delete/update/patch),
  # entao list fica sem resourceNames — a app descobre o CronJob unico por
  # list (app.py:_cleanup_cronjob). get/patch seguem travados por nome:
  # patch irrestrito permitiria reescrever jobTemplate (imagem arbitraria).
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["todolist-cleanup"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: todolist-reader
subjects:
  - kind: ServiceAccount
    name: todolist
roleRef:
  kind: Role
  name: todolist-reader
  apiGroup: rbac.authorization.k8s.io
