apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todolist-production
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: todolist
# configMapGenerator: hash no nome -> mudar a cor dispara rollout.
configMapGenerator:
  - name: todolist-config
    literals:
      - APP_COLOR=yellow
      - APP_NAME=TodoList
images:
  - name: ghcr.io/heitorfreitasferreira/todolist-app
    newTag: 179f41489758a4df52851f35114e5287a649ea5a
    digest: sha256:054b9f961a3a75fa905b9d7e7e82ab88effd0a199a2dd6f06b2289cdf1bff47e
