apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todolist-production
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: todolist
# configMapGenerator: hash no nome -> mudar a cor dispara rollout.
configMapGenerator:
  - name: todolist-config
    literals:
      - APP_COLOR=yellow
      - APP_NAME=TodoList
      # Tracing (OTel): exporta OTLP para o collector, que grava no Tempo.
      # Metricas e logs seguem no Prometheus (prometheus-flask-exporter) e no
      # Loki (Alloy), entao os exporters de metricas/logs do OTel ficam off.
      - OTEL_SERVICE_NAME=todolist
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability.svc.cluster.local:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=todolist,deployment.environment=production
images:
  - name: ghcr.io/heitorfreitasferreira/todolist-app
    newTag: 5810f68c41863ac2c7b289d16d0488803955f09c
    digest: sha256:2c05d9e53762403186afb94191e61885b029412fbd5183fa872da4ff050d42cd
