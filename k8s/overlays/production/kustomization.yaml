apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todolist-production
resources:
  - ../../base
  - namespace.yaml
  # SealedSecrets (gerados com kubeseal --scope strict, um por env):
  - sealed-postgres.yaml
  - sealed-auth.yaml
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: todolist
# configMapGenerator: hash no nome -> mudar a cor dispara rollout.
configMapGenerator:
  - name: todolist-config
    literals:
      - APP_COLOR=yellow
      - APP_NAME=TodoList
images:
  - name: ghcr.io/heitorfreitasferreira/todolist-app
    newTag: 2403ff952fd2e5173ff2ed2fd2f8eaf51b5831bc
    digest: sha256:72e079354297066e9ad559ba7688c7804709515f3630ae4bb7ae4c37d562cd7a
