apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todolist-staging
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: todolist
# configMapGenerator: o hash do conteudo entra no nome, o kustomize reescreve
# o envFrom.configMapRef do Deployment -> mudar a cor dispara rollout.
configMapGenerator:
  - name: todolist-config
    literals:
      - APP_COLOR=pink
      - "APP_NAME=TodoList [staging]"
      # Tracing (OTel): exporta OTLP para o collector, que grava no Tempo.
      # Metricas e logs seguem no Prometheus (prometheus-flask-exporter) e no
      # Loki (Alloy), entao os exporters de metricas/logs do OTel ficam off.
      - OTEL_SERVICE_NAME=todolist
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability.svc.cluster.local:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=todolist,deployment.environment=staging
images:
  - name: ghcr.io/heitorfreitasferreira/todolist-app
    newTag: cb27a307abec8a31a82c00f59b7c9b45d0554cdf
    digest: sha256:b52adf4681b2131121c475efd112b2b07054e700a57ede0970119cb8be378f79
