apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todolist-staging
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: todolist
# configMapGenerator: o hash do conteudo entra no nome, o kustomize reescreve
# o envFrom.configMapRef do Deployment -> mudar a cor dispara rollout.
configMapGenerator:
  - name: todolist-config
    literals:
      - APP_COLOR=pink
      - "APP_NAME=TodoList [staging]"
images:
  - name: ghcr.io/heitorfreitasferreira/todolist-app
    newTag: 179f41489758a4df52851f35114e5287a649ea5a
    digest: sha256:97b99117cb6631b13f405c7b11f353726d30ecdb3f9d6e2bfbe9cfb5cb477c10
