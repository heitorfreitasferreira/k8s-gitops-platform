apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todolist-staging
resources:
  - ../../base
  - namespace.yaml
  # SealedSecrets (gerados com kubeseal --scope strict, um por env):
  - sealed-postgres.yaml
  - sealed-auth.yaml
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: todolist
# configMapGenerator: o hash do conteudo entra no nome, o kustomize reescreve
# o envFrom.configMapRef do Deployment -> mudar a cor dispara rollout.
configMapGenerator:
  - name: todolist-config
    literals:
      - APP_COLOR=pink
      - "APP_NAME=TodoList [staging]"
images:
  - name: ghcr.io/heitorfreitasferreira/todolist-app
    newTag: 314f79e3e00627d0744263eaf25d6c37642ab00b
    digest: sha256:a5f9b22b082b9d735d893503426ce571985b3eadaa83d4d7188cb1dd2e93d9eb
