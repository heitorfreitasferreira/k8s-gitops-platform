apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todolist
spec:
  # TLS terminado no Ingress. Sem secretName o Traefik usa o cert self-signed
  # padrao (ok para local). Em producao: cert-manager + ACME/CA interna.
  tls:
    - hosts:
        - staging.local
  rules:
    - host: staging.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist
                port:
                  number: 80
